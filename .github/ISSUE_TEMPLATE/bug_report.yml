name: Bug report
description: Something in tracerworks does not work as the docs say.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. A security problem goes to the Security tab
        (Report a vulnerability), never here.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you saw instead.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: >-
        The command's output, the relauncher's journal or `tracerworks status`.
        Remove tokens, hostnames and anything private first.
      render: text
  - type: input
    id: version
    attributes:
      label: Version
      description: The commit or the date you installed tracerworks from.
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Linux distribution, Python version, Claude Code version.
