<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!-- Opened as an app on an iPhone (#823): the page runs under Apple's status
     bar, on its own background; the safe-area insets below keep it clear. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#121417">
<meta name="referrer" content="no-referrer">
<title>factory</title>
<!--
  The factory dashboard (#806), served by `tracerworks serve`. It only DRAWS
  snapshot.json: every rule (states, current ticket, order) lives in
  snapshot.py. No dependency, no build. Its only writes: the star (#1877)
  and the Settings tab (#2190), each through its own route of `serve`.
  Validated look: prototype/factory-dashboard (30/09).
-->
<style>
:root{--bg:#121417;--card:#1a1d21;--card2:#21252a;--line:#2f343b;--fg:#d9dde3;--dim:#7d8590;
  --accent:#5b9cf5;--accent-bg:#132033;--green:#7cc47f;--green2:#5b8f5e;--yellow:#e2b85c;--red:#e5696b;--grey:#6e7681;--violet:#b48cf2;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--fg);font:12.5px/1.45 var(--mono);overflow-x:hidden}
/* no rubber band (the operator, 16/10, as on his other screens): a flick with nothing to scroll no longer drags the page.
   On html only: its value is the window's. Body's overflow-x makes it a box of its own, and on it
   `none` stopped the wheel from reaching the window — the Quality tab no longer scrolled. */
html{overscroll-behavior:none}
body{padding:calc(12px + env(safe-area-inset-top)) calc(18px + env(safe-area-inset-right)) calc(18px + env(safe-area-inset-bottom)) calc(18px + env(safe-area-inset-left))}
button{font:inherit;color:inherit;background:none;border:0;padding:0;text-align:left;cursor:pointer}
a{color:var(--accent)}
.dim{color:var(--dim)} .acc{color:var(--accent)} .g{color:var(--green)} .y{color:var(--yellow)} .r{color:var(--red)}
.tt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.st-active{color:var(--green)} .st-ci{color:var(--yellow)} .st-blocked{color:var(--red)} .st-asking{color:var(--red)} .st-stopped{color:var(--grey)} .st-dead{color:var(--red)} .st-done{color:var(--green2)} .st-idle{color:var(--dim)} .st-parked{color:var(--yellow)}
#panel code{display:block;margin-top:4px;padding:4px 8px;border:1px solid var(--line);border-radius:4px;background:var(--card2);user-select:all}

/* header */
.hdr{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.brand{font-weight:700;font-size:14px} .brand .acc{margin-right:6px}
.live{font-size:11px;color:var(--dim)}
.refresh{margin-left:8px;color:var(--accent);border:1px solid #2d4a70;border-radius:4px;padding:0 6px}
.refresh:disabled{color:var(--dim);border-color:var(--line);cursor:default}
.refresh .ic{display:inline-block}
.refresh:disabled .ic{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* the gauges side by side, on one row that wraps on a narrow screen (#822) */
.gauges{display:flex;flex-wrap:wrap;gap:3px 18px;font-size:11.5px;align-items:center}
.gauge{display:inline-flex;gap:6px;align-items:center;white-space:nowrap;cursor:default;border-radius:3px}
.gauge:focus-visible{outline:1px solid var(--accent);outline-offset:2px}
/* the detail of a gauge, just under it (#848) */
#tip{position:absolute;z-index:40;max-width:min(360px,calc(100vw - 16px));background:#16191d;border:1px solid var(--line);border-radius:6px;padding:7px 10px;box-shadow:0 8px 24px #000a;font-size:11.5px;line-height:1.5}
#tip dl{display:grid;grid-template-columns:auto 1fr;gap:1px 12px;margin:4px 0 0}
#tip dt{color:var(--dim)} #tip dd{margin:0;overflow-wrap:anywhere}
#tip dd.n,#panel dd.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
#panel dl.nums{grid-template-columns:auto auto;justify-content:start}
/* a name and a bar; the figures are in the hover detail (the operator, 30/09) — and
   on a phone, where a tap shows it, the short value also stays under the bar */
.gauge .val{display:none}
@media (max-width:759px){.gauge{white-space:normal;flex-wrap:wrap;column-gap:6px}.gauge .val{display:inline}}
.bar{letter-spacing:-1px}

/* the Factory kanban (#1824): Queue · In development · Light check · Merge queue · Delivered,
   no bubble around a column; 5 → 3 → 2 → 1 columns */
.plan{display:grid;gap:18px 22px;grid-template-columns:repeat(5,minmax(0,1fr));grid-template-areas:"queue dev check mq livre"}
@media (max-width:1519px){.plan{grid-template-columns:repeat(3,minmax(0,1fr));grid-template-areas:"queue dev check" "mq livre ."}}
@media (max-width:1139px){.plan{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-areas:"queue dev" "check mq" "livre ."}}
@media (max-width:759px){body{padding:10px}.plan{grid-template-columns:minmax(0,1fr);grid-template-areas:"queue" "dev" "check" "mq" "livre"}}
/* in five columns the kanban goes down to the window's bottom (#1279): each column scrolls on its own */
.fitmode .plan{grid-template-rows:minmax(0,1fr)}
.fitmode .plan > .st{min-height:0;overflow-y:auto}
.st{min-width:0;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px 12px;position:relative;display:flex;flex-direction:column}
.st h3{margin:0 0 10px;font-size:11px;letter-spacing:.09em;color:var(--dim);font-weight:600;display:flex;justify-content:space-between;height:16px;line-height:16px}
.st h3 b{color:var(--fg);letter-spacing:0}
.plan > .st{background:none;border:0;border-radius:0;padding:0 2px}
.plan > .st h3{border-bottom:1px solid var(--line);padding-bottom:6px;height:auto;margin-bottom:4px}
.hint{color:var(--grey);font-size:10.5px;margin:2px 0 8px}
.empty{color:var(--dim);font-size:11px}
/* the banner: nothing for the operator to do, in green; or what needs them, one line each, in red */
.calm{display:flex;align-items:center;gap:8px;border:1px solid #2c4a2f;border-left:3px solid var(--green);background:#151c17;border-radius:8px;padding:6px 12px;margin:0 0 8px;font-size:11.5px;color:var(--dim)}
.calm b{color:var(--green);letter-spacing:.06em;font-weight:600}
.needs{border:1px solid #5b2e30;border-left:3px solid var(--red);background:#1c1618;border-radius:8px;padding:6px 12px;margin:0 0 8px}
.needs h3{margin:0 0 4px;font-size:11px;letter-spacing:.09em;color:var(--red);font-weight:600}
.needs .li:nth-child(odd){background:none} .needs .li .why{margin-left:8px}
/* the memory alert (#2096) wraps rather than cut its processes: never wider than the card, on a phone too */
.needs .li.wrap{height:auto;min-height:26px;padding:3px 8px} .needs .li.wrap .why{white-space:normal;overflow-wrap:anywhere}
/* the machine line: each runner and its job, the jobs waiting, the 30 latest runs (newest on the left) */
.machine{display:flex;flex-wrap:wrap;align-items:center;gap:4px 22px;font-size:11px;color:var(--dim);padding:4px 2px 10px;margin-bottom:12px;border-bottom:1px solid var(--line)}
.machine b{color:var(--fg);font-weight:500}
.machine .runs{margin-left:auto;display:flex;gap:2px;align-items:center}
.machine .runs button{width:6px;height:12px;border-radius:1px;background:var(--grey);padding:0}
.machine .runs button.ok{background:var(--green2)} .machine .runs button.ko{background:var(--red)}
.led{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--grey);margin-right:5px}
.led.busy{background:var(--accent)} .led.off{background:var(--red)}
/* a light card: number, rank, since when, a title on two lines at most, all at 11.5 px like Delivered;
   its edge says its worker — green working, violet waiting for the operator, red blocked */
.kcard{display:flex;flex-direction:column;width:100%;text-align:left;background:var(--card);border:1px solid transparent;border-radius:8px;padding:7px 9px;margin-bottom:7px;cursor:pointer;font-size:11.5px}
.kcard:hover{border-color:#3a4049} .kcard.work{border-color:var(--green2)} .kcard.you{border-color:var(--violet)} .kcard.bad{border-color:var(--red)}
.kcard .h{display:flex;gap:6px;color:var(--dim)} .kcard .h .id{color:var(--accent);font-weight:700} .kcard .h .lvl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0} .kcard .h .tm{margin-left:auto}
.kcard .t{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin:1px 0 2px;line-height:1.4}
.kcard .s{display:flex;gap:8px;color:var(--dim);min-width:0}
.kcard .s .w{flex:0 0 auto;font-weight:600} .kcard .s .w.you{color:var(--violet)} .kcard .s .w.bad{color:var(--red)}
.kcard .s .why{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.kcard .tks{margin-top:auto;padding-top:4px;align-self:stretch}
.kcard .ci{display:flex;align-items:center;gap:6px;color:var(--dim);margin-top:auto;padding-top:4px;min-width:0}
/* a PR's CI in dots, one a job, and its count; past 12 jobs, one bar by state */
.kcard .reds{flex:0 0 auto;white-space:nowrap;font-size:inherit;color:var(--dim)}
.dots{display:inline-flex;gap:2px;flex:0 1 auto;min-width:0} .dots i{flex:0 0 6px;width:6px;height:6px;border-radius:50%;background:#3a4049}
.dots i.ok,.cibar i.ok{background:var(--green2)} .dots i.run,.cibar i.run{background:var(--yellow)} .dots i.ko,.cibar i.ko{background:var(--red)}
.cibar{display:inline-flex;width:84px;height:6px;border-radius:3px;overflow:hidden;gap:1px;background:var(--bg)} .cibar i{display:block;height:100%;background:#3a4049}
/* the merge queue: the PR in test is itself blue, then « next », then the last exit */
.testing .kcard{background:var(--accent-bg);border-color:#2d4a70}
.lbl{font-size:10.5px;letter-spacing:.04em;color:var(--dim);margin:8px 0 4px}
.out{font-size:10.5px;color:var(--grey);margin-top:6px}
/* Delivered: merges and deployments stacked, a green line at each deployment */
.liv .row{display:flex;gap:8px;width:100%;padding:3px 2px;border-bottom:1px solid #1d2126;font-size:11.5px}
.liv .row:hover{background:#1a1d21}
.liv .row .n{color:var(--dim);flex:0 0 auto} .liv .row .x{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.liv .row .tm{margin-left:auto;color:var(--grey);flex:0 0 auto;font-size:10.5px}
.liv .dep{display:flex;align-items:center;gap:8px;width:100%;color:var(--green);font-size:10.5px;margin:6px 0 4px}
.liv .dep::after{content:"";flex:1;border-top:1px dashed var(--green2)}
.liv .wait{color:var(--yellow);font-size:10.5px;margin:0 0 4px}
/* Waiting on GitHub (#1820): a column a nature, no bubble, its issues as rows split by thin lines */
.ghplan{display:grid;gap:18px 22px;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.ghplan > .st{background:none;border:0;border-radius:0;padding:0 2px}
.ghplan > .st h3{border-bottom:1px solid var(--line);padding-bottom:6px;height:auto;margin-bottom:4px}
.ghrow{display:block;width:100%;color:inherit;text-decoration:none;padding:6px 2px 7px;border-bottom:1px solid #23272d;font-size:11.5px}
.ghrow:hover{background:#1a1d21}
.ghrow .h{display:flex;gap:6px;align-items:center;color:var(--dim);min-width:0} .ghrow .h .id{color:var(--accent);font-weight:700} .ghrow .h .tm{margin-left:auto;flex:0 0 auto}
.ghrow .h .lab{margin:0;font-size:10px;padding:0 5px}
.star{flex:0 0 auto;line-height:1;cursor:pointer;border-radius:4px;padding:0 2px}
.star:not(.on){opacity:0;color:var(--dim)} .kcard:hover .star, .ghrow:hover .star, .star:focus-visible{opacity:1}
@media (hover:none){.star:not(.on){opacity:.6}}
.starerr{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ghrow .t{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.4;margin-top:1px}
.ghrow .s{color:var(--dim)}

/* list rows */
.li{display:flex;gap:8px;align-items:center;height:26px;padding:0 8px;border:1px solid transparent;border-radius:4px;width:100%;position:relative}
.li:nth-child(odd){background:#1e2227}
.li:hover{border-color:#4a525c}
.li .num{color:var(--dim);flex:0 0 auto;width:40px;white-space:nowrap} .li .num.wide{width:auto}
.li .meta{margin-left:auto;color:var(--dim);font-size:11px;flex:0 0 auto;padding-left:6px}
.li.more{color:var(--accent);justify-content:center;background:none;border:1px dashed var(--line)}
.li .mark{flex:0 0 12px}
.sub{color:var(--dim);font-size:11px;margin:12px 0 5px} .sub:first-child{margin-top:0}
.next{font-size:11px;color:var(--dim);margin:0 0 10px} .next b{color:var(--fg);font-weight:600} .next-why{display:block;margin-top:2px}
.tag{font-size:10px;border:1px solid var(--line);border-radius:8px;padding:0 5px;flex:0 0 auto;color:var(--red);border-color:#5b2e30}

.tks{display:flex;align-items:center;align-self:center;min-width:0}
/* the tickets (the operator, 16/10): blocks of one size in a row that slides sideways,
   as many as the card holds; an edge with more beyond it fades, like the latest runs */
.tks-row{flex:1 1 auto;min-width:0;display:flex;gap:3px;padding:2px;overflow-x:auto;scrollbar-width:none;overscroll-behavior-x:contain}
.tks-row::-webkit-scrollbar{display:none}
.tks-row.more-r{-webkit-mask-image:linear-gradient(to right,#000 calc(100% - 44px),transparent);mask-image:linear-gradient(to right,#000 calc(100% - 44px),transparent)}
.tks-row.more-l{-webkit-mask-image:linear-gradient(to left,#000 calc(100% - 44px),transparent);mask-image:linear-gradient(to left,#000 calc(100% - 44px),transparent)}
.tks-row.more-l.more-r{-webkit-mask-image:linear-gradient(to right,transparent,#000 44px,#000 calc(100% - 44px),transparent);mask-image:linear-gradient(to right,transparent,#000 44px,#000 calc(100% - 44px),transparent)}
.tk{flex:0 0 46px;height:26px;border-radius:4px;background:#262a30;border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;gap:3px;font-size:11px}
.tk small{font-size:9.5px;color:var(--dim)}
.tk.done{color:var(--green2)} .tk.current{color:var(--green);border-color:var(--green);background:#1c2a1f} .tk.todo{color:var(--fg)}
.frac{color:var(--dim);margin-left:8px;font-size:11px;flex:0 0 auto}

/* the gauges, in the blue frame at the top (the operator, 30/09: it replaced the last-visit banner) */
.frame{border:1px solid var(--accent);border-radius:6px;padding:7px 12px;margin-bottom:12px;background:var(--accent-bg);line-height:1.9}
/* the tabs under the gauges (#839): the one shown is in the address (#factory, #trends, #quality) */
.tabs{display:flex;gap:4px;margin-bottom:14px;border-bottom:1px solid var(--line)}
.tab{padding:5px 14px;color:var(--dim);text-decoration:none;border:1px solid transparent;border-bottom:0;border-radius:6px 6px 0 0;margin-bottom:-1px}
.tab:hover{color:var(--fg)}
.tab.on{color:var(--fg);border-color:var(--line);background:var(--bg)}
/* the Settings tab (#2190): opened by the gear at the top right, from any tab */
.hdr>div:first-child{flex:1 1 0;min-width:0}
.gear{flex:0 0 auto;font-size:17px;line-height:1;color:var(--dim);text-decoration:none;padding:2px 4px;border:1px solid transparent;border-radius:4px}
.gear:hover,.gear.on{color:var(--fg)} .gear.on{border-color:var(--line)}
.sets{display:grid;gap:16px;max-width:760px}
.set{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:8px 0;border-top:1px solid var(--line);align-items:center}
.set:first-of-type{border-top:0;padding-top:0}
.set .in{display:flex;gap:8px;align-items:center;justify-content:flex-end;white-space:nowrap}
.set input{width:90px;font:inherit;color:var(--fg);background:var(--card2);border:1px solid var(--line);border-radius:4px;padding:2px 6px;text-align:right}
.set input:focus{outline:1px solid var(--accent);border-color:var(--accent)}
.set .hint{grid-column:1 / -1;font-size:11px}
.btn{color:var(--accent);border:1px solid #2d4a70;border-radius:4px;padding:1px 8px;white-space:nowrap}
.btn:disabled{color:var(--dim);border-color:var(--line);cursor:default}
.set input[type=checkbox]{width:auto;accent-color:var(--accent);transform:scale(1.3)}
.paused{border:1px solid var(--yellow);color:var(--yellow);border-radius:6px;padding:6px 12px;margin-bottom:12px}
.sets .foot{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:12px}
@media (max-width:759px){.set{grid-template-columns:minmax(0,1fr)}.set .in{justify-content:flex-start}.set input{font-size:16px}}
/* the Trends curves (#839): inline SVG, no library. Series: blue then orange, in that order;
   CI: status green ✓ / red ✗, never the color alone. Text stays in text colors. */
.charts{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
/* three columns from 1140 px — the plan's own step to three —, one below (#2048: at 760 px a third is
   200 px, its titles cut); a chart is drawn as wide as its column: its text stays 10 px */
@media (min-width:1140px){.charts{grid-template-columns:repeat(3,minmax(0,1fr))}}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .say{font-size:11.5px;margin:0 0 6px}
.chart .legend{display:flex;gap:14px;font-size:11px;color:var(--dim);margin-bottom:4px}
.chart .sw{display:inline-block;width:10px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .axis{fill:var(--dim);font-size:10px;font-family:var(--mono)} .chart .axis.pct{fill:#3987e5}
.chart .limit{stroke:var(--grey);stroke-width:1;stroke-dasharray:3 3}
.chart .nowline{stroke:var(--dim);stroke-width:1;stroke-dasharray:2 3;opacity:.6}
.mesh .dim{font-weight:400;letter-spacing:0;margin-left:8px}
.chart .ln{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .proj{fill:none;stroke-width:2;stroke-dasharray:5 4;opacity:.8}
.s1{stroke:#3987e5;background:#3987e5} .s2{stroke:#d95926;background:#d95926}
.ci-ok{fill:#0ca30c;background:#0ca30c} .ci-ko{fill:#d03b3b;background:#d03b3b}
.kbar{display:flex;height:10px;border-radius:3px;overflow:hidden;margin:2px 0 8px;background:var(--line)} .kbar span{display:block;height:100%}
.k1{fill:#3987e5;background:#3987e5} .k2{fill:#d95926;background:#d95926} .k3{fill:#6b7a8c;background:#6b7a8c} .k4{fill:#2fa36b;background:#2fa36b}
/* the vertical cursor (#2050): its line, a dot per curve, the column lit, and its label beside it */
.plot{position:relative}
.chart svg[data-chart]{touch-action:pan-y;cursor:crosshair;outline:none;border-radius:4px}
.chart svg[data-chart]:focus-visible{box-shadow:0 0 0 1px var(--accent)}
.chart .xline{stroke:var(--fg);stroke-opacity:.55;stroke-width:1}
.chart .xband{fill:var(--fg);fill-opacity:.07}
.chart .xdot{stroke:var(--card);stroke-width:1.5}
.xdot.s1{fill:#3987e5} .xdot.s2{fill:#d95926}
.xtag{position:absolute;top:0;z-index:5;pointer-events:none;background:#16191d;border:1px solid var(--line);border-radius:6px;padding:5px 9px;box-shadow:0 8px 24px #000a;font-size:11px;line-height:1.5;width:max-content;max-width:min(240px,45%)}
.xtag .xt{color:var(--dim)} .xtag dl{display:grid;grid-template-columns:auto auto;gap:0 12px;margin:2px 0 0}
.xtag dt{white-space:nowrap} .xtag dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
/* Quality (#840): one tile per indicator, then the curves and the flaky tests */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:12px;margin-bottom:16px}
.tile{min-height:96px;width:100%}
/* Measures (#1821): the span chosen, then a heading a section */
.spans{display:flex;gap:4px;margin:0 0 12px} .spans button{border:1px solid var(--line);border-radius:4px;padding:1px 9px;color:var(--dim)}
.spans button.on{color:var(--fg);border-color:var(--accent)}
.mesh{font-size:11px;letter-spacing:.09em;color:var(--dim);font-weight:600;margin:22px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--line)}
button.tile:hover{border-color:#4a525c}
.tile .big{font-size:17px;font-weight:700;margin:2px 0 4px}
.tile .dim{font-size:11px}
.rank{width:100%;border-collapse:collapse;table-layout:fixed}
.rank th{color:var(--dim);font-weight:400;text-align:left;font-size:11px;padding:0 8px 6px 0}
.rank th:nth-child(2){width:60px} .rank th:nth-child(3){width:130px} .rank th:nth-child(4){width:32%}
.rank td{padding:5px 8px 5px 0;border-top:1px solid var(--line);vertical-align:top}
@media (max-width:759px){.rank,.rank tbody{display:block}.rank tr:first-child{display:none}
  .rank tr{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;border-top:1px solid var(--line);padding:6px 0}
  .rank td{border:0;padding:0}.rank td:first-child,.rank td:last-child{grid-column:1/-1}

/* the stars clicked, until the snapshot says them (#1877) */

/* The last snapshot received, kept in THIS browser: the page opens on it at
   once, marked with its age, and the fresh one replaces it without a flash (#820). */
const SNAPSHOT_KEY = 'tracerworks.dashboard.snapshot';
/* The last visit lives in THIS browser only (the server keeps nothing): it is
   written when the page is left, so the mark stays put while it is looked at. */
const VISIT_KEY = 'tracerworks.dashboard.lastVisit';
const lastVisit = () => Number(localStorage.getItem(VISIT_KEY)) || Date.now() / 1000 - 24 * 3600;
let BASELINE = lastVisit();
const isNew = t => t != null && t > BASELINE;
addEventListener('pagehide', () => localStorage.setItem(VISIT_KEY, String(Date.now() / 1000)));

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let REG = {}, regN = 0;  // what a click opens, by id; the open panel's ids outlive a refresh
const reg = o => { const id = 'i' + (regN++); REG[id] = o; return id; };
const now = () => Date.now() / 1000;
const ago = t => t == null ? '?' : (s => TXT.ago(s < 60 ? `${Math.floor(s)} s` : duration(s)))(Math.max(0, now() - t));
const bar = (pct, n = 10) => { const k = Math.max(0, Math.min(n, Math.round(pct / 100 * n))); return '█'.repeat(k) + '░'.repeat(n - k); };
const issueUrl = n => `https://github.com/${DATA.repo}/issues/${n}`;
const gh = (url, label) => `<a class="gh" href="${esc(url)}" target="_blank" rel="noopener noreferrer">↗ ${esc(label)}</a>`;

/* « blocked » only for a worker that asked the operator (needs-human, #830). */
const STATE = Object.fromEntries(Object.entries({ active: '●', ci: '◌', blocked: '■', asking: '■', done: '✓', idle: '◇', stopped: '○', dead: '✗', parked: '◌' }).map(([k, g]) => [k, [g, TXT.state[k]]]));
/* One state per chantier (#1729): the snapshot's `phase_text`, the words of
   `tracerworks status`, glyph and colour by its phase; the old reading without it. */
const PHASE = { queued: ['○', 'idle'], development: ['●', 'active'], light_check: ['◌', 'ci'], merge_queue: ['◎', 'ci'],
  human: ['■', 'blocked'], blocked: ['■', 'dead'], parked: ['◐', 'parked'], done: ['✓', 'done'] };
const stateOf = w => w.phase && PHASE[w.phase]
  ? `<span class="st-${PHASE[w.phase][1]}">${PHASE[w.phase][0]} ${esc(w.phase_text)}</span>`
  : w.role === 'set_aside'
  ? `<span class="st-parked">◐ ${esc(TXT.setAsideFor(w.set_aside && w.set_aside.for))}</span>`
  : `<span class="st-${esc(w.state)}">${(STATE[w.state] || ['?', w.state])[0]} ${esc((STATE[w.state] || ['?', w.state])[1])}</span>`;

function vpsCharts(hours, totalMb, at) {

    for (const h of hours) { const v = h[i];
      if (v == null || (last != null && h[0] - last > 3600)) { if (run.length) out.push(run); run = []; }
      if (v != null) run.push([h[0], v]);
      last = h[0]; }
    if (run.length) out.push(run);
    return out; };

    series: runs(i).map((points, n) => ({ cls: 's1', key: `s1-${n}`, name: title.toLowerCase(), points, proj: null })) }));
  return one(TXT.memoryTitle, 1, totalMb || 0, v => `${(v / 1024).toFixed(1)} ${TXT.gb}`)
    + one(TXT.cpuTitle, 2, 100, v => `${Math.round(v)}%`)

  const series = [], every = labelEvery(m.days.length);
  for (const p of parts) { let run = [];
    const cut = () => { if (run.length) series.push({ cls: p.cls, key: `${p.cls}-${series.length}`, name: p.name, points: run, proj: null }); run = []; };
    m.days.forEach((d, i) => { const v = m.series[p.k][i]; if (v == null) cut(); else run.push([dayX(d), v]); });
    cut(); }
  return lineChart({ key, x0: dayX(m.days[0]) - DAY_S / 2, x1: dayX(m.days[m.days.length - 1]) + DAY_S / 2, y1, exact, limits, fmt, series,
    xs: m.days.map(dayX), legend: parts.map(p => ({ cls: p.cls, name: p.name })),
    xlabels: m.days.filter((_, i) => (m.days.length - 1 - i) % every === 0).map(d => [dayX(d), short(d)]),

    bars: m.days.map((d, i) => ({ label: short(d), parts: parts.map(p => ({ v: m.series[p.k][i] || 0, cls: p.cls })),
      rows: [...parts.map(p => [p.cls, p.name, m.series[p.k][i] == null ? TXT.measures.noData : fmt(m.series[p.k][i])]),

async function load(fresh = false) {
  if (LOADING) return;
  FETCHED = Date.now(); LOADING = true; clearTimeout(NEXT);
  if (DATA) showLive();
  try {
    const answer = await fetch(fresh ? 'snapshot.json?fresh=1' : 'snapshot.json', { cache: 'no-store', credentials: 'same-origin' });
    if (!answer.ok) throw new Error(`HTTP ${answer.status} ${(await answer.text()).trim().slice(0, 200)}`.trim());
    const body = await answer.json(); FAILED = null;
    body.received_at = Date.now() / 1000;
    if (body.built_at != null) {  // null: the server's first build is under way
      try { localStorage.setItem(SNAPSHOT_KEY, JSON.stringify(body)); } catch { /* full: the page still works */ }
      DATA = shaped(body); REMEMBERED = false;
      settleStars(STARS, DATA, now());
    }
    else if (DATA) DATA.building = true;
    schedule(body.built_at == null ? 2 : nextLoadIn(snapshotAge(body, body.received_at), body.building));
  } catch (err) {
    FAILED = err.message || String(err);
    schedule(RETRY_S);
  } finally {
    LOADING = false;
    if (DATA && DATA.built_at != null && !FAILED) render(); else showLive();
    loadTab();  // a tab's curves follow the same cycle
  }
}
setInterval(() => { if (DATA) showLive();  // the age, second by second
  document.querySelectorAll('#panel [data-since]').forEach(el => { el.textContent = clock(now() - Number(el.dataset.since)); });
  if (DATA && DATA.built_at != null) document.querySelectorAll('[data-until]').forEach(el => { el.textContent = countdown(Number(el.dataset.until) - serverNow()); }); }, 1000);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { localStorage.setItem(VISIT_KEY, String(Date.now() / 1000)); return; }
  BASELINE = lastVisit();
  // Timers sleep with the tab: coming back, ask at once if the cycle has passed.
  if (Date.now() >= NEXT_AT && Date.now() - FETCHED > 5000) load(); else if (DATA) render();
});
DATA = remembered(); REMEMBERED = DATA !== null;
load();              // in flight from here: the remembered snapshot says « updating… »
if (DATA) render();  // at once, never an empty page
</script>
